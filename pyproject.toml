[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fakturama-i2c"
version = "0.1.0"
description = "Fakturama Image-to-Cash automation: order image -> verified Order + linked Invoice via UI Automation"
requires-python = ">=3.10,<3.13"
dependencies = [
    "paddlepaddle==3.0.0",
    "paddleocr>=3.1,<3.2",
    "paddlex>=3.1,<3.2",  # paddleocr 3.1 breaks with paddlex 3.2+ (PaddlePredictorOption signature)
    "openai>=1.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pillow>=10",
    "pywinauto>=0.6.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pymupdf>=1.24"]

[project.scripts]
fakturama-i2c = "fakturama_i2c.cli:main"

[tool.setuptools.packages.find]
include = ["fakturama_i2c*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
